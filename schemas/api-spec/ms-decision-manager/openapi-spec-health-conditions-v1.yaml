openapi: '3.1.0'

info:
  title: DWP PIP Decision Manager Service
  description: Rest API for operations relating to supporting health conditions for decision to a claim
  version: '@project.version@'

servers:
  - url: 'https://localhost:8080'

paths:

  /v1/health-conditions:
    post:
      tags:
        - health-conditions
      summary: Record Health Conditions to support decision
      operationId: recordHealthConditions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordHealthConditionsRequest'
      responses:
        201:
          description: CREATED - Health Conditions recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordHealthConditionsResponse'
        400:
          description: BAD REQUEST - badly formed json or values not valid
        409:
          description: CONFLICT - health conditions for review already exists
        500:
          description: INTERNAL SERVER ERROR - an internal error occurred\

    put:
      tags:
        - health-conditions
      summary: Update Health Conditions to support decision
      operationId: updateHealthConditions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordHealthConditionsRequest'
      responses:
        204:
          description: NO CONTENT - Health Conditions updated successfully
        400:
          description: BAD REQUEST - badly formed json or values not valid
        404:
          description: NOT FOUND - health conditions for review can not be found
        500:
          description: INTERNAL SERVER ERROR - an internal error occurred

    get:
      tags:
        - health-conditions
      summary: Get pick-list of health conditions
      operationId: getAllHealthConditions
      responses:
        200:
          description: OK - pick-list of health conditions exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHealthConditionsResponse'
        404:
          description: NOT FOUND - reference data list is empty
        500:
          description: INTERNAL SERVER ERROR - an internal error occurred

  /v1/health-conditions/{reviewId}:
    get:
      tags:
        - health-conditions
      summary: Get all stored health conditions against a review id
      operationId: getHealthConditionsByReviewId
      parameters:
        - name: reviewId
          in: path
          description: unique review id
          required: true
          schema:
            example: "6ed1d430716609122be7a4d6"
            type: string
            pattern: ^[a-zA-Z0-9]{24}
      responses:
        200:
          description: OK - health condition exists for stored review id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSupportingHealthConditionsResponse'
        400:
          description: BAD REQUEST - badly formed request
        404:
          description: NOT FOUND - stored decision not found for provided id
        500:
          description: INTERNAL SERVER ERROR - an internal error occurred

components:
  securitySchemes:
    sideCarProxySecurity:
      type: mutualTLS
      description: "Security is enforced by an external side car proxy using mTLS, not directly by this API"
      x-sidecar-implementation: true
  schemas:
    RecordHealthConditionsRequest:
      title: RecordHealthConditionsRequest
      type: object
      required:
        - supporting_health_conditions
        - review_id
      description: Health conditions to support a decision.
      allOf:
        - $ref: 'includes/components.yaml#/components/schemas/ReviewId'
        - type: object
          properties:
            supporting_health_conditions:
              $ref: 'includes/health-conditions-components.yaml#/components/schemas/SupportingHealthConditions'

    RecordHealthConditionsResponse:
      title: RecordHealthConditionsResponse
      type: object
      allOf:
        - $ref: 'includes/health-conditions-components.yaml#/components/schemas/SupportingHealthConditionsId'

    GetSupportingHealthConditionsResponse:
      title: GetSupportingHealthConditionsResponse
      type: object
      required:
        - supporting_health_conditions
      description: Health conditions to support a decision.
      allOf:
        - $ref: 'includes/components.yaml#/components/schemas/ReviewId'
        - type: object
          properties:
            supporting_health_conditions:
              $ref: 'includes/health-conditions-components.yaml#/components/schemas/SupportingHealthConditions'

    GetHealthConditionsResponse:
      title: GetHealthConditionsResponse
      type: object
      properties:
        health_conditions:
          type: array
          items:
            $ref: 'includes/health-conditions-components.yaml#/components/schemas/HealthCondition'

security:
  - sideCarProxySecurity : []
