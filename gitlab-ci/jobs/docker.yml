########################################################################################
###    Jobs specific to docker builds                                                ###
###      - linting                                                                   ###
###      - image build                                                               ###
###      - image test                                                                ###
###      - image push                                                                ###
########################################################################################


### TRIGGERS
.docker-build: &docker-build
  rules:
    - if: $BUILD_TYPE

.docker-not-prod: &docker-not-prod
  rules:
    - if: $BUILD_TYPE && $ENVIRONMENT == 'nonprodacct'

.docker-not-merge: &docker-not-merge
  rules:
    - if: $BUILD_TYPE && $MERGE_TO_DEVELOP == null

.docker-build-only-prod: &docker-build-only-prod
  rules:
    - if: $BUILD_TYPE && $PROD_RELEASE == "true"
  environment:
    name: "prodacct"
    action: prepare

.prepare-test: &prepare-test
  before_script:
    - echo $CI_JOB_TOKEN | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY
    - export GITLAB_IMAGE="$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:${CI_COMMIT_SHA:0:8}"
    - export MOCK_IMAGE="$PIP_APPLY_MOCKS_IMAGE:$PIP_APPLY_MOCKS_BRANCH"
    - echo $DT_API_TOKEN_SAAS | docker login -u eyq18885 --password-stdin https://eyq18885.live.dynatrace.com

### LINT
docker-lint:
  extends: .docker-lint-template
  <<: *docker-not-merge
  needs: []

### BUILD
docker-build:
  extends: .docker-build-template
  before_script:
    - echo $DT_API_TOKEN_SAAS | docker login -u eyq18885 --password-stdin https://eyq18885.live.dynatrace.com
  variables:
    ADD_LATEST_TAG: "true"
    DOCKER_CLI_ARGS: "--build-arg GITLAB_REGISTRY_TOKEN=${GITLAB_REGISTRY_TOKEN}"
  <<: *docker-build
  needs: [maven-package]

### COMPONENT TEST
api-test:
  extends: .docker-compose-run-template
  stage: component-test
  variables:
    DOCKER_COMPOSE_FILE: "docker-compose.yml"
    DOCKER_COMPOSE_PRE: "docker-compose up -d --scale api-test=0"
    DOCKER_COMPOSE_COMMAND: "--exit-code-from api-test api-test"
    MVN_OPTS: '-Dmaven.repo.local=~/.m2/repository'
    MVN_M2: "~/.m2"
  <<: *prepare-test
  after_script:
    - docker logout
  cache:
    key: ${CI_PROJECT_NAME}
    paths:
      - ~/.m2/repository/
  artifacts:
    expire_in: 1 day
    paths:
      - target/test/reports/
    when: always
    expose_as: 'Document Submission manager API Component Test Report'
  <<: *docker-build
  needs: [maven-package, docker-build]

### IMAGE TEST
trivy-container:
  extends: .trivy-container-base
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  <<: *docker-build
  needs: [docker-build]

container-test-command:
  extends: .container-test-template
  <<: *docker-build
  needs: [docker-build]

### IMAGE PUSH
push-to-ecr-nonprodaws:
  extends:
    - .setup-id-token
    - .acquire-oidc-credentials
    - .push-to-ecr
  variables:
    ACCOUNT_ID: $NONPROD_SHARED_ACCOUNT_ID
    ASSUME_ROLE_ACCOUNT_ID: $NONPROD_SHARED_ACCOUNT_ID
  <<: *docker-build

push-to-ecr-prodaws:
  extends:
    - .setup-id-token
    - .acquire-oidc-credentials
    - .push-to-ecr
  variables:
    ACCOUNT_ID: $PROD_SHARED_ACCOUNT_ID
    ASSUME_ROLE_ACCOUNT_ID: $PROD_SHARED_ACCOUNT_ID
  <<: *docker-build-only-prod

dwp-place-change-verification-trigger:
  variables:
    ASSUME_ROLE_ACCOUNT_ID: $PROD_SHARED_ACCOUNT_ID
  <<: *docker-build-only-prod

